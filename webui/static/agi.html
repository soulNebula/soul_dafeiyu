<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WXBOX · AGI 草稿</title>
<style>
:root{
  --bg:#1e1f22; --bg-deep:#16171a; --panel:#232428; --card:#26282c;
  --border:#101114; --border-soft:#34373d; --border-softer:#2b2e33;
  --text:#e6e6e6; --text-dim:#9aa0a6; --text-faint:#6b7076;
  --accent:#4a9eff; --ok:#3fa96b; --warn:#d99b3f; --bad:#d9534f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:19px;margin:0;font-weight:600}
.sub{color:var(--text-dim);font-size:12.5px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
button{font:inherit;border:1px solid var(--border-soft);background:var(--card);
       color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer}
button:hover{background:#2c2f34;border-color:#45484f}
button.primary{background:#2b4a6f;border-color:#3a628f}
button.primary:hover{background:#325480}
button:disabled{opacity:.45;cursor:not-allowed}
label.chk{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;cursor:pointer}
.status{font-size:12.5px;color:var(--text-faint)}
.card{background:var(--panel);border:1px solid var(--border-softer);border-radius:10px;
      padding:14px 16px;margin-bottom:12px}
.card.ok{border-left:3px solid var(--ok)}
.card.no{opacity:.72;border-left:3px solid #4a4d53}
.card.dropped{background:#212226}
.txt{font-size:16px;line-height:1.75;margin:2px 0 10px;word-break:break-word}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-faint)}
.tag{padding:1px 8px;border-radius:99px;border:1px solid var(--border-soft);font-size:11.5px}
.tag.share{color:#7fd0a0;border-color:#2f6a4b}
.tag.ask{color:#8ab6ea;border-color:#34557d}
.tag.ok{color:var(--ok);border-color:#2f6a4b}
.tag.no{color:var(--text-faint)}
.err{margin-top:8px;font-size:12px;color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{padding:5px 12px;font-size:12.5px;border-radius:6px}
.empty{color:var(--text-faint);padding:40px 0;text-align:center}
pre{background:var(--bg-deep);border:1px solid var(--border-softer);border-radius:8px;
    padding:10px;font-size:12px;color:var(--text-dim);overflow:auto;max-height:240px;white-space:pre-wrap}
.foot{margin-top:26px;font-size:12px;color:var(--text-faint);line-height:1.9}
.foot b{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AGI 草稿</h1>
    <span class="sub">只读记忆 + dry-run 生成 · <b>零发送能力</b></span>
  </header>
  <div class="bar">
    <button class="primary" id="btnGen">生成 10 条</button>
    <button id="btnRefresh">刷新</button>
    <label class="chk"><input type="checkbox" id="onlyOk"> 只看合格</label>
    <span class="status" id="status">加载中…</span>
  </div>
  <div id="list"></div>
  <div class="foot">
    <b>本项目没有任何发送代码。</b>上面的文本需要你手工复制到微信发出。<br>
    判断标准只有一个：<b>这话我会不会说？</b> 不看分数。
  </div>
</div>
<script>
const TOKEN = "__WXBOX_TOKEN__";
const H = {"X-WXBOX-Token": TOKEN, "Content-Type": "application/json"};
const $ = (id) => document.getElementById(id);
let timer = null;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function jget(url){
  const r = await fetch(url, {headers: H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function jpost(url, body){
  const r = await fetch(url, {method:'POST', headers:H, body: JSON.stringify(body||{})});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function render(data){
  const box = $('list');
  const items = data.items || [];
  if(!items.length){
    box.innerHTML = '<div class="empty">' + esc(data.note || '还没有草稿，点上面「生成 10 条」') + '</div>';
    return;
  }
  box.innerHTML = items.map(it => {
    const ok = !!it.qualified;
    const type = (it.type || '').trim();
    const cls = ok ? 'card ok' : 'card no';
    const errs = (it.errors && it.errors.length)
      ? '<div class="err">未通过：' + errs_(it.errors) + '</div>' : '';
    return `<div class="${cls}" data-text="${esc(it.text)}">
      <div class="txt">${esc(it.text)}</div>
      <div class="meta">
        <span class="tag ${type==='ask'?'ask':'share'}">${esc(type||'—')}</span>
        <span class="tag ${ok?'ok':'no'}">${ok?'合格':'未通过'}</span>
        <span>${esc(it.id||'')}</span>
        <span>${esc(it.topic||'')}</span>
      </div>
      ${errs}
      <div class="acts"><button data-copy>复制</button></div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const text = btn.closest('.card').dataset.text;
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      const old = btn.textContent; btn.textContent = '已复制 ✓';
      setTimeout(()=>{ btn.textContent = old; }, 1200);
    });
  });
}
function errs_(arr){ return arr.map(e=>esc(e)).join('；'); }

async function load(){
  const onlyOk = $('onlyOk').checked;
  try{
    const data = await jget('/api/agi/drafts' + (onlyOk ? '?qualified=1' : ''));
    render(data);
    $('status').textContent = data.total
      ? `${data.total} 条 · 合格 ${data.qualified||0} 条`
      : '暂无草稿';
  }catch(e){
    $('status').textContent = '读取失败：' + e.message;
  }
}

async function poll(){
  try{
    const s = await jget('/api/agi/status');
    const job = s.job || {};
    if(job.running){
      const sec = Math.round((Date.now()/1000) - (job.started||0));
      $('status').textContent = `生成中… ${sec}s（约 10 次模型调用）`;
      $('btnGen').disabled = true;
      return true;
    }
    $('btnGen').disabled = false;
    if(timer){ clearInterval(timer); timer = null; }
    if(job.finished){
      $('status').textContent = job.ok ? '生成完成' : '生成失败，见下';
      if(!job.ok && job.tail){
        const box = $('list');
        box.insertAdjacentHTML('afterbegin', '<pre>' + esc(job.tail) + '</pre>');
      }
      await load();
    }
    return false;
  }catch(e){ return false; }
}

$('btnGen').addEventListener('click', async () => {
  $('btnGen').disabled = true;
  try{
    await jpost('/api/agi/generate', {limit: 10});
    $('status').textContent = '已启动…';
    if(!timer) timer = setInterval(poll, 2000);
    poll();
  }catch(e){
    $('btnGen').disabled = false;
    $('status').textContent = '启动失败：' + e.message;
  }
});
$('btnRefresh').addEventListener('click', load);
$('onlyOk').addEventListener('change', load);

load();
poll();
</script>
</body>
</html>
